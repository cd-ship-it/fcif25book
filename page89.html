<div class="t" id="p89-t1">過去，我常以為宣教是做好事工，但神卻透過與同工們</div>
<div class="t" id="p89-t2">同行的日子塑造我的生命，讓我明白服事的對象不只是</div>
<div class="t" id="p89-t3">「孩童與婦女」，也很需要牧養本地同工 ……</div>
<div class="t" id="p89-t4">閱讀全文</div>
<div class="t" id="p89-t5">以愛同行— </div>
<div class="t" id="p89-t6">在事奉中被神塑造</div>
<div class="t" id="p89-t7">成為宣教士前，莫慧玲是</div>
<div class="t" id="p89-t8">一名藥房配藥員。一場大</div>
<div class="t" id="p89-t9">病讓她認真思考生命的意</div>
<div class="t" id="p89-t10">義，毅然回應呼召：「做宣</div>
<div class="t" id="p89-t11">教士需要『願意給』。我不</div>
<div class="t" id="p89-t12">留後路，願意離開熟悉的</div>
<div class="t" id="p89-t13">地方、完全獻給神，去實</div>
<div class="t" id="p89-t14">現與祂的約定。」</div>
<div class="t" id="p89-t15">莫慧玲 （後排左二）與豐榮社區中心本地同工合照。</div>
<div class="t" id="p89-t16">柬埔寨副工場主任    莫慧玲</div>
<div class="t" id="p89-t17">生命果子呈獻</div>
</div>
