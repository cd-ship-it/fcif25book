<div class="t" id="p27-t1">第二層面的傳承 ── </div>
<div class="t" id="p27-t2">較廣義的傳承 </div>
<div class="t" id="p27-t3">在當今世代，我們傳承神的心意與托負，承繼了歷代女宣教士的佳美腳蹤。無論是西方女宣教士，如推動創立「天足會」與興女學的立德夫人（Alicia Little），「中國孤兒之母」艾偉德（Gladys Aylward），以及中國女教士先驅，如「佈道家」余慈度等人，她們都在中國婦女受盡壓制的社會與教會中，作出了非凡的貢獻。我們傳承這些「傳奇女將」的典範，領受異象與使命，靠著神恩典邁向豐榮之旅。 </div>
