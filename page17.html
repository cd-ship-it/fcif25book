<div class="t" id="p17-t2">姊妹們，</div>
<div class="t" id="p17-t3">不要輕看自己，勇敢站起來！</div>
<div class="t" id="p17-t4">發揮神所託付的恩賜，</div>
<div class="t" id="p17-t5">與弟兄彼此成全、並肩同行，</div>
<div class="t" id="p17-t6">同心完成神所交付的使命。</div>
<div class="t" id="p17-t7">但願涓涓細流，</div>
<div class="t" id="p17-t8">終將匯成滾滾江河；</div>
<div class="t" id="p17-t9">願生命的活水，</div>
<div class="t" id="p17-t10">穿越高山深谷，</div>
<div class="t" id="p17-t11">滋潤乾旱之地；</div>
<div class="t" id="p17-t12">願神起初創造的心意，</div>
<div class="t" id="p17-t13">在祂的教會中重新綻放，</div>
<div class="t" id="p17-t14">恢復伊甸的豐榮！</div>
