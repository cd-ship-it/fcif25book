<div class="t" id="p67-t5">Sameth（沙密）以他的駕駛專業</div>
<div class="t" id="p67-t6">來服事女孩們。</div>
<div class="t" id="p67-t7">有一次接送，我看到一個父母健在有兩個孩子的家庭，女孩卻長期處於危險中。讓我想到自己原生家庭有八個孩子，母親卻盡心照顧我們。這份強烈對比讓我第一次意識到，我的工作不只是開車接送，更是幫助這群受傷女孩重新獲得保護與盼望……</div>
