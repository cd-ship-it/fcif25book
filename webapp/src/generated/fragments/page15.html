<div class="page" id="page15">
<div class="t" id="p15-t1">二．共舞</div>
<div class="t" id="p15-t2">異象的養分，</div>
<div class="t" id="p15-t3">來自秀嫻、淑儀與我合著的</div>
<div class="t" id="p15-t4">《還我伊甸的豐榮》；</div>
<div class="t" id="p15-t5">異象的成形，</div>
<div class="t" id="p15-t6">源於一群同路人</div>
<div class="t" id="p15-t7">共舞一支「多元中合一」的圓舞曲。</div>
<div class="t" id="p15-t8">百花齊放，</div>
<div class="t" id="p15-t9">取代一枝獨秀；</div>
<div class="t" id="p15-t10">三股合成的繩子，</div>
<div class="t" id="p15-t11">取代對立競逐；</div>
<div class="t" id="p15-t12">彼此交融，</div>
<div class="t" id="p15-t13">取代互相排斥；</div>
<div class="t" id="p15-t14">三一真神互愛共融的榮耀，</div>
<div class="t" id="p15-t15">取代個人終將朽壞的冠冕。</div>
<div class="t" id="p15-t16">這支舞曲，</div>
<div class="t" id="p15-t17">能否為男女同工同盟掀開新的篇章？</div>
<div class="t" id="p15-t18">不再是父權文化，</div>
<div class="t" id="p15-t19">也不是母權文化；</div>
<div class="t" id="p15-t20">乃是在三一真神的愛中，</div>
<div class="t" id="p15-t21">男女彼此成全、同工同盟、</div>
<div class="t" id="p15-t22">同建榮耀的國度文化。</div>
</div>
