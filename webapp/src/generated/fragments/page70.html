<div class="t" id="p70-t9">神預備了三位身處美加不同教會、卻渴慕生命成長的弟兄同行。 三年學習建立的信任，是我們投入「男性靈命塑造與事工整合」研究的起點，期待陪伴更多弟兄一同前行 ……</div>
<div class="t" id="p70-t10">許多年後，我也許會忘記某句教導，但老師們愛人服事、在年邁重病中依靠神的榜樣，將深刻留在生命裡。這正是豐榮寶貴的傳承 — 把對神的信心與對人的愛代代相傳 ……</div>
