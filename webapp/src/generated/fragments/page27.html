<div class="t" id="p27-t1">第二層面的傳承 ── </div>
<div class="t" id="p27-t2">較廣義的傳承。 </div>
<div class="t" id="p27-t3">在當今世代，我們傳承神的心意與托負，承繼了歷</div>
<div class="t" id="p27-t4">代女宣教士的佳美腳蹤。無論是西方女宣教士，如</div>
<div class="t" id="p27-t5">推動創立「天足會」與興女學的立德夫人（Alicia</div>
<div class="t" id="p27-t6">Little ），「中國孤兒之母」艾偉德（Gladys</div>
<div class="t" id="p27-t7">Aylward），以及中國女教士先驅，如「佈道家」</div>
<div class="t" id="p27-t8">余慈度等人，她們都在中國婦女受盡壓制的社會與</div>
<div class="t" id="p27-t9">教會中，作出了非凡的貢獻。我們傳承這些「傳奇</div>
<div class="t" id="p27-t10">女將」的典範，領受異象與使命，靠著神恩典邁向</div>
<div class="t" id="p27-t11">豐榮之旅。 </div>
</div>
