<div class="t" id="p72-t1">25 年來，神不單在豐榮開展善工，回應人的身心</div>
<div class="t" id="p72-t2">靈需要，更呼喚各方弟兄姊妹一同參與。無論您</div>
<div class="t" id="p72-t3">在何時、因何事投入豐榮，無論您此刻身在何</div>
<div class="t" id="p72-t4">方；只要我們連結於神的呼召，就是跨代同行</div>
<div class="t" id="p72-t5">者。邀請您一起來彼此認識，共享不同時空所結</div>
<div class="t" id="p72-t6">下的神緣人緣。</div>
<div class="t" id="p72-t7">生命果子呈獻三</div>
<div class="t" id="p72-t8">豐榮新知舊雨</div>
</div>
