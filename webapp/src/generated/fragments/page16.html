<div class="page" id="page16">
<div class="t" id="p16-t1">三．樹成林</div>
<div class="t" id="p16-t2">圓舞的圈子，</div>
<div class="t" id="p16-t3">愈來愈廣；</div>
<div class="t" id="p16-t4">同行的人，</div>
<div class="t" id="p16-t5">愈來愈多。</div>
<div class="t" id="p16-t6">事工也如枝葉伸展，</div>
<div class="t" id="p16-t7">從美國，到柬埔寨，</div>
<div class="t" id="p16-t8">到香港、台灣……</div>
<div class="t" id="p16-t9">一步一步，</div>
<div class="t" id="p16-t10">向更遠的地方延伸。</div>
<div class="t" id="p16-t11">服事的對象，</div>
<div class="t" id="p16-t12">也不斷拓展——</div>
<div class="t" id="p16-t13">從女教牧、宣教士、師母、神學生，</div>
<div class="t" id="p16-t14">到受欺壓、遭受性侵、</div>
<div class="t" id="p16-t15">因貧困而失學的女孩與婦女；</div>
<div class="t" id="p16-t16">再延伸至</div>
<div class="t" id="p16-t17">向弟兄姊妹共同開放的</div>
<div class="t" id="p16-t18">靈命塑造與領袖培育。</div>
<div class="t" id="p16-t19">種子長成了樹木，</div>
<div class="t" id="p16-t20">伸展枝椏，彼此相連，</div>
<div class="t" id="p16-t21">漸漸形成了森林。</div>
