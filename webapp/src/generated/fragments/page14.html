<div class="page" id="page14">
<div class="t" id="p14-t1">一．夢</div>
<div class="t" id="p14-t2">春風把花瓣裡待不住的種子，</div>
<div class="t" id="p14-t3">抖落大地，待不住是因為</div>
<div class="t" id="p14-t4">一股「神聖的不滿」在催逼；</div>
<div class="t" id="p14-t5">男女同受造物主尊貴的形像，</div>
<div class="t" id="p14-t6">同蒙救贖主憐愛更新，</div>
<div class="t" id="p14-t7">為何女性卻常被視為次等、次要，</div>
<div class="t" id="p14-t8">甚至在神的家中</div>
<div class="t" id="p14-t9">也是如此？</div>
<div class="t" id="p14-t10">子粒落地，</div>
<div class="t" id="p14-t11">在深厚的泥土裡彼此相遇；</div>
<div class="t" id="p14-t12">它們傾訴心聲，</div>
<div class="t" id="p14-t13">淚光在真理的眼眸中閃動；</div>
<div class="t" id="p14-t14">遠方與近處的故事，</div>
<div class="t" id="p14-t15">一一激盪著生命的脈搏。</div>
<div class="t" id="p14-t16">同路人仰望蒼天，同聲叩問：</div>
<div class="t" id="p14-t17">何時，男女才能恢復造物主原初的心意？</div>
<div class="t" id="p14-t18">何時，才能同工同盟，活出基督的豐榮？</div>
<div class="t" id="p14-t19">就在一次次真誠的聆聽、</div>
<div class="t" id="p14-t20">一次次深刻的共鳴中，</div>
<div class="t" id="p14-t21">同理心悄然萌芽，</div>
<div class="t" id="p14-t22">盼望開始滋長，</div>
<div class="t" id="p14-t23">而「異象」，</div>
<div class="t" id="p14-t24">終於破土而出。</div>
