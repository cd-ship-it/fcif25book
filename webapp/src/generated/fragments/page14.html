<div class="page" id="page14">
<div class="t" id="p14-t1">一．夢</div>
<div class="t" id="p14-t2">春風把花瓣裡待不住的種子，抖落大地，待不住是因為一股「神聖的不滿」在催逼；男女同受造物主尊貴的形像，同蒙救贖主憐愛更新，為何女性卻常被視為次等、次要，甚至在神的家中也是如此？</div>
<div class="t" id="p14-t3">子粒落地，</div>
<div class="t" id="p14-t4">在深厚的泥土裡彼此相遇；</div>
<div class="t" id="p14-t5">它們傾訴心聲，淚光在真理的眼眸中閃動；遠方與近處的故事，一一激盪著生命的脈搏。</div>
<div class="t" id="p14-t6">同路人仰望蒼天，同聲叩問：</div>
<div class="t" id="p14-t7">何時，男女才能恢復造物主原初的心意？</div>
<div class="t" id="p14-t8">何時，才能同工同盟，活出基督的豐榮？</div>
<div class="t" id="p14-t9">就在一次次真誠的聆聽、一次次深刻的共鳴中，同理心悄然萌芽，盼望開始滋長，而「異象」，終於破土而出。</div>
</div>
