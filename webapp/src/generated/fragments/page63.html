<div class="t" id="p63-t3">李若男</div>
<div class="t" id="p63-t4">豐榮同工</div>
<div class="t" id="p63-t5">生命果子呈獻</div>
<div class="t" id="p63-t6">神賜給我的自創歌 — 《我的寶貝》（國語）</div>
<div class="t" id="p63-t7">李若男（右一）一家四口與劉秀嫻</div>
<div class="t" id="p63-t8">（右二）聚餐近照。</div>
<div class="t" id="p63-t9">2022年退修會講員劉小玢鼓勵</div>
<div class="t" id="p63-t10">我們安靜親近神，若累了可以</div>
<div class="t" id="p63-t11">小睡休息。我讀完材料後便小</div>
<div class="t" id="p63-t12">睡片刻，醒來看到窗外恬靜安</div>
<div class="t" id="p63-t13">詳的景色，旋律與歌詞突然如</div>
<div class="t" id="p63-t14">流水般在腦中湧現。看著歌</div>
<div class="t" id="p63-t15">詞，我崩潰大哭……</div>
