<div class="t" id="p63-t7">李若男（右一）一家四口與劉秀嫻</div>
<div class="t" id="p63-t8">（右二）聚餐近照。</div>
<div class="t" id="p63-t9">2022 年退修會講員劉小玢鼓勵我們安靜親近神，若累了可以小睡休息。我讀完材料後便小睡片刻，醒來看到窗外恬靜安詳的景色，旋律與歌詞突然如流水般在腦中湧現。看著歌詞，我崩潰大哭……</div>
