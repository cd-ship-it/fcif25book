<div class="t" id="p18-t1">記得我在西南浸信會神學院（SouthwesternBaptist Theological Seminary）修讀第一門基督教教育課程時，教授說了一句令我畢生難忘的話：</div>
<div class="t" id="p18-t2">「基督教教育工作者一上任，就應當開始</div>
<div class="t" id="p18-t3">work yourself out of a job——培植能夠接替</div>
<div class="t" id="p18-t4">自己的人！」</div>
<div class="t" id="p18-t5">這句話深深烙印在我心中。從此，「培植同</div>
<div class="t" id="p18-t6">工，接替自己」成為我在不同事奉崗位上刻</div>
<div class="t" id="p18-t7">意實踐的使命。</div>
<div class="t" id="p18-t8">回顧基督豐榮團契二十五年來神的帶領，何</div>
<div class="t" id="p18-t9">嘗不是一段不斷傳承的旅程呢？</div>
<div class="t" id="p18-t10">創辦人  劉秀嫻（Dora Wang）</div>
<div class="t" id="p18-t11">培植同工，接替自己</div>
</div>
