<div class="page" id="page18">
<div class="t" id="p18-t1">記得我在西南浸信會神學院（Southwestern</div>
<div class="t" id="p18-t2">Baptist Theological Seminary）修讀第一門</div>
<div class="t" id="p18-t3">基督教教育課程時，教授說了一句令我畢生難</div>
<div class="t" id="p18-t4">忘的話：</div>
<div class="t" id="p18-t5">「基督教教育工作者一上任，就應當開始</div>
<div class="t" id="p18-t6">work yourself out of a job——培植能夠接替</div>
<div class="t" id="p18-t7">自己的人！」</div>
<div class="t" id="p18-t8">這句話深深烙印在我心中。從此，「培植同</div>
<div class="t" id="p18-t9">工，接替自己」成為我在不同事奉崗位上刻意</div>
<div class="t" id="p18-t10">實踐的使命。</div>
<div class="t" id="p18-t11">回顧基督豐榮團契二十五年來神的帶領，何嘗</div>
<div class="t" id="p18-t12">不是一段不斷傳承的旅程呢？</div>
<div class="t" id="p18-t13">創辦人  劉秀嫻 (Dora Wang)</div>
<div class="t" id="p18-t14">培植同工，接替自己</div>
</div>
