<div class="t" id="p10-t5">1997年，邱清萍、劉秀嫻與吳淑儀合著《還我伊甸的豐榮》（香港中神出版 ），奠定「基督豐榮團契」的異象，深入探討兩性在神計劃中的平等、互補與復和。此書隨後促成了專欄討論及三人合編的《兩性復和》一書。</div>
