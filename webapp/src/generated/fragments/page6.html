<div class="t" id="p6-t2">我一直認為自己是豐榮的「產品」。這一切要從二十五年前說起，仍記得那一天開車往機場，接幾位從加州來的女傳道來參加一個特會。那時，我正處於人生低谷，身心都在恢復中。一位創辦人問我：「妳的呼召是什麼？」「隨便啦 !」我漫不經心地回答。她盯著我說……</div>
