<div class="t" id="p61-t1">閱讀全文</div>
<div class="t" id="p61-t2">我曾有幸在豐榮與吳萃芳(Vicky) 傳道一起同工。她當</div>
<div class="t" id="p61-t3">時是副會長，也是我的主管。然而，我從未感受到「上</div>
<div class="t" id="p61-t4">下級」的距離；她更像一位願意同行、願意傾聽的屬靈</div>
<div class="t" id="p61-t5">前輩。最難忘是彼此間那份難得且深厚的默契。一個眼</div>
<div class="t" id="p61-t6">神、一句話，甚至還未把想法說完，對方已經明白；甚</div>
<div class="t" id="p61-t7">至，我們會不約而同提出相同構想 ……</div>
<div class="t" id="p61-t8">異象，活在生命裏</div>
<div class="t" id="p61-t9">洗嘉琪曾短暫作豐榮同工，現於教會牧會。</div>
<div class="t" id="p61-t10">吳萃芳曾任豐榮前會長，現任柬埔寨基督豐榮團契董事。</div>
<div class="t" id="p61-t11">洗嘉琪與吳萃芳    師友同行</div>
<div class="t" id="p61-t12">洗嘉琪（右）與吳萃芳（左）於豐榮短暫同工，卻深深結緣。</div>
<div class="t" id="p61-t13">生命果子呈獻</div>
</div>
