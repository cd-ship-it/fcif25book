<div class="t" id="p1-t1">你們因著信，在基督耶穌裡</div>
<div class="t" id="p1-t2">都作了神的兒子。你們所有</div>
<div class="t" id="p1-t3">受洗歸入基督的人，都是披</div>
<div class="t" id="p1-t4">戴基督的，並不分猶太人或</div>
<div class="t" id="p1-t5">希臘人，作奴僕的或自由</div>
<div class="t" id="p1-t6">人，男的或女的，因為你們</div>
<div class="t" id="p1-t7">在基督耶穌裡都成為一體</div>
<div class="t" id="p1-t8">了。如果你們屬於基督，就</div>
<div class="t" id="p1-t9">是亞伯拉罕的後裔，是按照</div>
<div class="t" id="p1-t10">應許承受產業的了。</div>
