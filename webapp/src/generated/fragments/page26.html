<div class="page" id="page26">
<div class="t" id="p26-t1">第一層面的傳承 ── </div>
<div class="t" id="p26-t2">最廣義的傳承。 </div>
<div class="t" id="p26-t3">這源於創世記所記載的三部曲：</div>
<div class="t" id="p26-t4">創造：</div>
<div class="t" id="p26-t5">男女共同受托管理萬物，並肩建立和諧的社會。</div>
<div class="t" id="p26-t6">墮落：</div>
<div class="t" id="p26-t7">人類的犯罪墮落，破壞了人與神、人與人的關係，</div>
<div class="t" id="p26-t8">更帶來社會文化中「結構性與制度性」的罪惡：如</div>
<div class="t" id="p26-t9">性別歧視、種族歧視與階級歧視。</div>
<div class="t" id="p26-t10">救贖：</div>
<div class="t" id="p26-t11">傳福音與社會公義，是帶回人與神、人與人重新和</div>
<div class="t" id="p26-t12">好的雙重使命。</div>
<div class="t" id="p26-t13">在這部從墮落到贖的救恩歷史中，我們受托傳承歷</div>
<div class="t" id="p26-t14">代神對女性的定位與使命。無論是從聖經中的女性</div>
<div class="t" id="p26-t15">如底波拉等在神子民信心旅程上的貢獻，還是如抹</div>
<div class="t" id="p26-t16">大拉馬利亞等，在苦難中</div>
<div class="t" id="p26-t17">䝉</div>
<div class="t" id="p26-t18">神眷顧的激勵，我們都</div>
<div class="t" id="p26-t19">將傳承這份異象與使命，在神恩裡邁向豐榮之旅。 </div>
</div>
