<div class="page" id="page26">
<div class="t" id="p26-t1">第一層面的傳承 ── </div>
<div class="t" id="p26-t2">最廣義的傳承 </div>
<div class="t" id="p26-t3">這源於創世記所記載的三部曲：</div>
<div class="t" id="p26-t4">創造：</div>
<div class="t" id="p26-t5">男女共同受托管理萬物，並肩建立和諧的社會。</div>
<div class="t" id="p26-t6">墮落：人類的犯罪墮落，破壞了人與神、人與人的關係，更帶來社會文化中「結構性與制度性」的罪惡：如性別歧視、種族歧視與階級歧視。</div>
<div class="t" id="p26-t7">救贖：</div>
<div class="t" id="p26-t8">傳福音與社會公義，是帶回人與神、人與人重新</div>
<div class="t" id="p26-t9">和好的雙重使命。</div>
<div class="t" id="p26-t10">在這部從墮落到救贖的救恩歷史中，我們受托傳</div>
<div class="t" id="p26-t11">承歷代神對女性的定位與使命。無論是從聖經中</div>
<div class="t" id="p26-t12">的女性如底波拉等在神子民信心旅程上的貢獻，</div>
<div class="t" id="p26-t13">還是如抹大拉馬利亞等，在苦難中</div>
<div class="t" id="p26-t14">䝉</div>
<div class="t" id="p26-t15">神眷顧的激</div>
<div class="t" id="p26-t16">勵，我們都將傳承這份異象與使命，在神恩裡邁</div>
<div class="t" id="p26-t17">向豐榮之旅。 </div>
</div>
