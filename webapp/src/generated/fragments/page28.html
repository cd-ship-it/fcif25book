<div class="t" id="p28-t1">第三層面的傳承 ── </div>
<div class="t" id="p28-t2">最狹義的傳承</div>
<div class="t" id="p28-t3">1998 年我們一群姊妹們成立「基督豐榮團契」，在神面前領受異象與使命。多年來，我們透過神學釋經與社會文化的探討，按神心意，以福音及社會關懷服事今天的世代，靠著神的恩典邁向豐榮之旅！</div>
<div class="t" id="p28-t4">傳福音誠是天國的宣講、社會關懷是天國的示範！兩者</div>
<div class="t" id="p28-t5">的聯結與整合，是神托負我們的整全天國使命！</div>
<div class="t" id="p28-t6">耶穌「道成肉身」來到這破碎、罪惡的世界，帶出社會關懷行動，活出公義、憐憫與救贖的整全使命！並要求我們效法衪的典範！四福音書所記載的耶穌傳道經歷，委實充滿了令人驚訝、走出框框的社會關懷的行動！這是十字架的終極真諦！也是人類歷史中劃時代的福音！</div>
