<div class="t" id="p84-t1">要做到「同工同盟」，你們是如何彼此成全？</div>
<div class="t" id="p84-t2">劉</div>
<div class="t" id="p84-t3">：要清楚自己與配偶的強項，敢於承認自己的有限。我大線條，而</div>
<div class="t" id="p84-t4">怡青觀察細膩……</div>
<div class="t" id="p84-t5">林</div>
<div class="t" id="p84-t6">：耀光同時兼顧機構與教會時，我接下能承擔的以減輕其重擔。後</div>
<div class="t" id="p84-t7">來，我擔任代理傳道，他尊重並尊榮我的角色轉變，公開提醒大家尊</div>
<div class="t" id="p84-t8">重我的帶領 ……</div>

<div class="t" id="p84-t11">劉耀光牧師是中信總幹事，林怡青傳道是基督豐榮團契靈命塑造事工主任。</div>
<div class="t" id="p84-t12">夫婦曾在緬甸宣教，及在北加州樂城華人基督教會牧會七年。夫妻結婚27年，育有三個兒子。</div>
<div class="t" id="p84-t13">教牧夫婦劉耀光及林怡青同心同行。</div>
