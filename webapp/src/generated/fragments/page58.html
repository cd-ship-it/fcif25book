<div class="t" id="p58-t3">第一次見到吳淑儀 （Lily），是她來訪我服務的家暴庇</div>
<div class="t" id="p58-t4">護所。我不曾想到，這次相遇會讓從神而來的異象，在</div>
<div class="t" id="p58-t5">往後二十多年深深影響我的生命與服事。2024年，當</div>
<div class="t" id="p58-t6">我疲乏於不知為何而戰時，Lily鼓勵我重新尋求神，不</div>
<div class="t" id="p58-t7">因環境改變喪膽，繼續走向社區有需要的人。那時我明</div>
<div class="t" id="p58-t8">白，異象傳承不是守住機構或職位，而是……</div>
