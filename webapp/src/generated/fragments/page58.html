<div class="t" id="p58-t2">閱讀全文</div>
<div class="t" id="p58-t3">第一次見到吳淑儀 （Lily），是她來訪我服務的家暴庇護所。我不曾想到，這次相遇會讓從神而來的異象，在往後二十多年深深影響我的生命與服事。2024 年，當我疲乏於不知為何而戰時，Lily 鼓勵我重新尋求神，不因環境改變喪膽，繼續走向社區有需要的人。那時我明白，異象傳承不是守住機構或職位，而是……</div>
