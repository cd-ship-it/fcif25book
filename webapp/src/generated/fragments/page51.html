<div class="t" id="p51-t1">靈命塑造事工</div>
<div class="t" id="p51-t2">閱讀全文</div>
<div class="t" id="p51-t3">2005 年的首屆退修會上，靈修導師 Jan Johnson 帶領</div>
<div class="t" id="p51-t4">我們在大自然中靜聆主音。那次靈裡的飽足，讓同工們</div>
<div class="t" id="p51-t5">深感此類操練的不可或缺，順勢點燃了一個共同的夢想</div>
<div class="t" id="p51-t6">— 擁有屬於豐榮的退修中心……</div>
<div class="t" id="p51-t7">信心在前，供應在後 —</div>
<div class="t" id="p51-t8">見證購置「豐榮中心」</div>
<div class="t" id="p51-t9">「基督豐榮團契」會長  潘蒙愛 (Linda Pan)</div>
<div class="t" id="p51-t10">2005年潘蒙愛（前排右三）参與首屆女同工</div>
<div class="t" id="p51-t11">退修會，邀得 Jan Johnson 作講員。</div>
<div class="t" id="p51-t12">2017年購置位於北加州海沃</div>
<div class="t" id="p51-t13">（Hayward）的「豐榮中心」。</div>
