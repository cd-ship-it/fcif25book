<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FiCF 25 — Timeline Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="timeline.css">
<style>
  /* Canvas here is just the real timeline1.jpg as a background — no
     redrawn wave/bubbles, only absolutely-positioned title/tooltip
     overlays on top (see timeline.js's renderTimelineOverlay). */
  body { background: #6b6b6b; }
  .canvas {
    position: relative;
    width: 1280px;
    height: 828px;
    margin: 24px auto;
    background-image: url('timeline1.jpg');
    background-size: 1280px 828px;
    background-repeat: no-repeat;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>

<script src="timeline.js"></script>
<script>
// x/y = each bubble's actual pixel center in timeline1.jpg (1280x828),
// hand-measured against the image; dir = which side of the bubble the
// title stack goes on (matches which side the bubble sits on in the image).

</body>
</html>
