<div class="t" id="p6-t2">我一直認為自己是豐榮的「產品」。這一切要從二十五</div>
<div class="t" id="p6-t3">年前說起，仍記得那一天開車往機場，接幾位從加州來</div>
<div class="t" id="p6-t4">的女傳道來參加一個特會。那時，我正處於人生低谷，</div>
<div class="t" id="p6-t5">身心都在恢復中。一位創辦人問我：「妳的呼召是什</div>
<div class="t" id="p6-t6">麼？」「隨便啦 !」我漫不經心地回答。她盯著我說……</div>
<div class="t" id="p6-t7">董事會主席  邱佩鳳 (Carmen)</div>
<div class="t" id="p6-t8">基督豐榮團契與我</div>
<div class="t" id="p6-t9">感恩致謝</div>
<div class="t" id="p6-t10">2005年邱佩鳳與三創辦人邱清萍、劉秀嫻</div>
<div class="t" id="p6-t11">及吳淑儀（由左至右）。</div>
<div class="t" id="p6-t12">2006年邱佩鳳（左後方穿紅色外套）與</div>
<div class="t" id="p6-t13">一衆姊妹在首屆研討會合照。</div>
